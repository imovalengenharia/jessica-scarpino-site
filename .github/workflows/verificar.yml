# A cada mudança, confere se as notas geram o site sem erro (campo vazio,
# foto que não existe...). Se falhar, o GitHub avisa por e-mail e o
# Render também não publica a versão quebrada.
name: verificar
on: [push, pull_request]
jobs:
  gerar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node gerar.js
